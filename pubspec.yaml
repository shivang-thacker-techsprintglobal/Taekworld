name: taekworld
description: Taekworld — Flutter app with feature-first Clean Architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Immutable models / unions
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # URL Launcher
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0

  # Push notifications (FCM)
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.3
  device_info_plus: ^13.2.0
  uuid: ^4.5.1
  app_badge_plus: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_launcher.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_launcher.png
  adaptive_icon_foreground_inset: 24
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
